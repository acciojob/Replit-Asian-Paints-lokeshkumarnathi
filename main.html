<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asian Paints</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="grid-container">
    <div id="grid-item" class="grid-box" data-id="1">1</div>
    <div id="grid-item" class="grid-box" data-id="2">2</div>
    <div id="grid-item" class="grid-box" data-id="3">3</div>
    <div id="grid-item" class="grid-box" data-id="4">4</div>
    <div id="grid-item" class="grid-box" data-id="5">5</div>
    <div id="grid-item" class="grid-box" data-id="6">6</div>
    <div id="grid-item" class="grid-box" data-id="7">7</div>
    <div id="grid-item" class="grid-box" data-id="8">8</div>
    <div id="grid-item" class="grid-box" data-id="9">9</div>
  </div>

  <div class="controls">
    <input type="number" id="block_id" placeholder="Block ID">
    <input type="text" id="colour_id" placeholder="Color">

    <button id="change_button">Change Color</button>
    <button id="Reset">Reset</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
